# Entorno de desarrollo. Usá ./start.sh y ./stop.sh en lugar de llamar a docker compose directo.
name: pistaklero

x-dev: &dev
  image: pistaklero-dev:1
  build:
    context: .
    dockerfile: docker/dev.Dockerfile
  init: true
  # Corre con tu usuario para que los archivos generados sean tuyos y no de root.
  user: "${HOST_UID:?Usá ./start.sh}:${HOST_GID:?Usá ./start.sh}"
  # Red del host: la app y Supabase se ven en 127.0.0.1, igual desde el navegador que desde el servidor.
  network_mode: host
  # Misma ruta que en el host: así funcionan los montajes que crea la CLI de Supabase.
  working_dir: ${PROJECT_DIR:?Usá ./start.sh}
  volumes:
    - .:${PROJECT_DIR}
    - pnpm-store:/pnpm-store
    - dev-home:/home/dev

services:
  # App Next.js en modo desarrollo (http://127.0.0.1:3000).
  web:
    <<: *dev
    # Solo escucha en localhost (127.0.0.1): no queda expuesta a la red local.
    # Con "--hostname 127.0.0.1" Next arma las reescrituras con "localhost", las toma como externas
    # y las rutas traducidas (/es/ingresar → /es/sign-in) entran en bucle.
    command: ["pnpm", "dev", "--hostname", "localhost"]

  # Contenedor de herramientas: pnpm, CLI de Supabase, tests. Se usa con ./run.sh.
  # Es el único con acceso al socket de Docker, porque la CLI de Supabase levanta sus propios contenedores.
  tools:
    <<: *dev
    profiles: ["tools"]
    group_add: ["${DOCKER_GID:?Usá ./start.sh}"]
    volumes:
      - .:${PROJECT_DIR}
      - pnpm-store:/pnpm-store
      - dev-home:/home/dev
      - /var/run/docker.sock:/var/run/docker.sock

  # Tests de punta a punta (Playwright + axe) contra la app levantada. Se usa con ./e2e.sh.
  # La versión de la imagen tiene que coincidir con @playwright/test en package.json.
  e2e:
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    profiles: ["e2e"]
    init: true
    ipc: host
    user: "${HOST_UID:?Usá ./start.sh}:${HOST_GID:?Usá ./start.sh}"
    network_mode: host
    working_dir: ${PROJECT_DIR:?Usá ./start.sh}
    volumes:
      - .:${PROJECT_DIR}
    env_file:
      - path: .env.local
        required: false
    environment:
      HOME: /tmp
      CI: ${CI:-}

volumes:
  pnpm-store:
  dev-home:
